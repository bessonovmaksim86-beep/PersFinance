name: SpotBugs

on:
  push:
  pull_request:

jobs:
  spotbugs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run SpotBugs
        run: mvn -B spotbugs:check